---
layout: default
---
<article class="artwork">
  <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %Y" }}</p>
  {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  {{ content }}
  <p><a href="{{ '/' | relative_url }}">← Back to gallery</a></p>
</article>

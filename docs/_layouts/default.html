<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="burger" aria-hidden="true"><span></span><span></span><span></span></label>
    <nav>
      <a href="{{ '/' | relative_url }}">gallery</a>
      <a href="{{ '/about/' | relative_url }}">about</a>
      <a href="{{ '/contact/' | relative_url }}">contact</a>
      {% if site.instagram != "" %}<a href="https://instagram.com/{{ site.instagram }}" target="_blank" rel="noopener">instagram</a>{% endif %}
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>© {{ 'now' | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
